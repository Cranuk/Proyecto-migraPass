services:
  migra-pass:
    build:
      context: ./migraPass
      dockerfile: Dockerfile
    container_name: migra-pass
    restart: unless-stopped
    ports:
      - "8080:80"
      - "5173:5173"
    volumes:
      - ./migraPass:/var/www/html
    networks:
      - red_cranuk

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - red_cranuk

volumes:
  dbdata:

networks:
  red_cranuk:
    external: true
